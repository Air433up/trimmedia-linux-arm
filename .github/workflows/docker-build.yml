name: Build ARM64 Docker Image

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 在 runner（x86_64）上原生交叉编译 Go，不需要 QEMU ----
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cross-compile Go launchers
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: arm64
          CC: aarch64-linux-gnu-gcc
        run: |
          mkdir -p _build
          echo "=== Building rpcbroker ==="
          go build -v -trimpath -ldflags="-s -w" -o _build/rpcbroker.arm64 ./apps/rpcbroker
          echo "=== Building mediasrv ==="
          go build -v -trimpath -ldflags="-s -w" -o _build/mediasrv.arm64 ./apps/mediasrv
          echo "=== Building fntv ==="
          go build -v -trimpath -ldflags="-s -w" -o _build/fntv.arm64 ./apps/fntv
          echo "=== Building fnmusic ==="
          go build -v -trimpath -ldflags="-s -w" -o _build/fnmusic.arm64 ./apps/fnmusic
          echo "=== All Go binaries built ==="
          ls -lh _build/

      - name: Compile nodri.so (ARM64)
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -o _build/nodri.so nodri.c
          ls -lh _build/nodri.so

      # ---- Docker 构建（只做打包，不编译） ----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cipack
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
