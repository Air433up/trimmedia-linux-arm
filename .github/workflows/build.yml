name: Build TrimMedia ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          # 让 package.sh 中的 gcc 命令指向 ARM64 交叉编译器
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc /usr/local/bin/gcc

      - name: Build all apps
        run: make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trimmedia-arm64
          path: out/*.tgz
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: trimmedia-arm64
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tgz
          generate_release_notes: true
